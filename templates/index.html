<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>منصة الأستاذة هايدي عطية التعليمية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #030712;
            --cyan: #00f2fe;
            --blue: #38bdf8;
            --purple: #9b51e0;
            --emerald: #10b981;
            --rose: #f43f5e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --font-sans: 'Readex Pro', 'Cairo', sans-serif;
            --radius-full: 9999px;
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow-x: hidden; position: relative;
            padding: 2.5rem 1rem 1.5rem 1rem;
        }

        canvas#bg-canvas {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; opacity: 0.85;
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 0; opacity: 0.25;
            animation: orbFloat 22s infinite alternate ease-in-out;
        }
        .orb--1 { width: 440px; height: 440px; top: -150px; right: -100px; background: radial-gradient(circle, var(--cyan), transparent 70%); }
        .orb--2 { width: 420px; height: 420px; bottom: -150px; left: -100px; background: radial-gradient(circle, var(--purple), transparent 70%); }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, -35px) scale(1.08); }
        }

        .hero-container {
            position: relative; z-index: 10;
            width: 100%; max-width: 650px;
            padding: 1rem 0.5rem; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 🤖 كارت الروبوت الملوح الجالس أعلى كادر الصورة */
        .sitting-robot-companion {
            position: absolute;
            top: -62px;
            left: -18px;
            z-index: 25;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
            filter: drop-shadow(0 10px 18px rgba(0, 242, 254, 0.35));
            transition: var(--transition-smooth);
        }

        .sitting-robot-companion:hover {
            transform: scale(1.1) translateY(-4px);
        }

        .waving-hand-arm {
            transform-origin: 34px 44px;
            animation: waveArm 1.6s ease-in-out infinite alternate;
        }

        @keyframes waveArm {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-28deg); }
        }

        /* 💬 مربع الرسائل القصير والمحدد */
        .bot-bubble-top {
            position: absolute;
            top: -24px;
            right: 48px;
            background: rgba(13, 20, 38, 0.94);
            border: 1.5px solid var(--cyan);
            backdrop-filter: blur(12px);
            padding: 5px 12px;
            border-radius: 12px 12px 2px 12px;
            font-size: 0.78rem;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
            animation: bubbleBob 2.5s ease-in-out infinite alternate;
        }

        @keyframes bubbleBob {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        .avatar-box {
            position: relative; 
            width: 225px; height: 225px;
            margin: 1.8rem auto 1.6rem auto;
        }

        .avatar-ring {
            position: absolute; inset: -7px; border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--purple), var(--blue), var(--cyan));
            background-size: 300% 300%;
            animation: ringSpin 7s linear infinite;
            box-shadow: 0 0 45px rgba(0, 242, 254, 0.4);
        }

        @keyframes ringSpin {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-img-wrap {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; background: #070d1e;
            padding: 5px; overflow: hidden;
        }

        .avatar-img-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            object-position: center top;
            border-radius: 50%;
        }

        .badge-verified {
            position: absolute; bottom: 10px; right: 14px;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #030712; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 900; border: 3px solid var(--bg-primary);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.65);
        }

        .teacher-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 18px; border-radius: var(--radius-full);
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: var(--cyan); font-size: 0.85rem; font-weight: 700;
            margin-bottom: 0.8rem; backdrop-filter: blur(10px);
        }

        h1.teacher-title {
            font-size: clamp(1.6rem, 7.5vw, 2.7rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            line-height: 1.2;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        h1.teacher-title span {
            background: linear-gradient(135deg, #ffffff 40%, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .cta-button-group {
            display: flex; gap: 1rem; justify-content: center;
            width: 100%; max-width: 440px; flex-wrap: wrap;
        }

        .btn-cta {
            flex: 1; min-width: 170px;
            padding: 0.95rem 1.6rem; border-radius: var(--radius-full);
            font-size: 1rem; font-weight: 800;
            cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; border: none; outline: none;
            transition: var(--transition-smooth);
        }

        .btn-register-cta {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #030712;
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.35);
        }
        .btn-register-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
        }

        .btn-login-cta {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            border: 1px solid rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(10px);
        }
        .btn-login-cta:hover {
            border-color: var(--cyan); color: var(--cyan);
            transform: translateY(-2px);
            background: rgba(0, 242, 254, 0.08);
        }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(3, 7, 18, 0.88);
            backdrop-filter: blur(20px);
            display: none; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .auth-card {
            background: rgba(13, 20, 38, 0.96);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 22px; width: 100%; max-width: 420px;
            padding: 1.8rem 1.4rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: absolute; top: 16px; left: 16px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem; transition: 0.2s;
        }
        .modal-close:hover { background: var(--rose); border-color: var(--rose); }

        .role-selector {
            display: flex; gap: 6px; background: rgba(0, 0, 0, 0.45);
            padding: 4px; border-radius: var(--radius-full); margin-bottom: 1.2rem;
        }
        .role-btn {
            flex: 1; padding: 8px; border-radius: var(--radius-full);
            background: transparent; border: none; color: var(--text-secondary);
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.25s;
        }
        .role-btn.active {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #040711;
        }

        .form-input, .form-select {
            width: 100%; padding: 11px 14px;
            background: rgba(7, 12, 26, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.16);
            border-radius: 12px; color: #fff;
            font-size: 0.9rem; margin-bottom: 0.9rem;
            outline: none; transition: 0.25s;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }
        .form-select option { background: #070d1e; color: #fff; }

        .btn-submit {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff; font-weight: 800; font-size: 1rem;
            border-radius: 14px; border: none; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
            transition: 0.25s;
        }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.1); }

        @media (max-width: 480px) {
            .avatar-box { width: 195px; height: 195px; margin: 1.6rem auto 1.4rem auto; }
            .sitting-robot-companion { top: -56px; left: -14px; }
            .sitting-robot-companion svg { width: 70px; height: 70px; }
            .bot-bubble-top { 
                top: -20px; 
                right: 36px; 
                padding: 4px 10px;
                font-size: 0.72rem;
            }
            .teacher-tag { font-size: 0.8rem; padding: 5px 15px; }
            .cta-button-group { flex-direction: column; width: 100%; gap: 0.75rem; }
            .btn-cta { width: 100%; min-width: unset; padding: 0.85rem 1.2rem; font-size: 0.95rem; }
            .auth-card { padding: 1.5rem 1.1rem; border-radius: 18px; }
        }
    </style>
</head>
<body>

    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <canvas id="bg-canvas"></canvas>

    <div class="hero-container">
        
        <div class="avatar-box">
            <!-- 🤖 الروبوت الجالس يلوح بيده للطلاب -->
            <div class="sitting-robot-companion" onclick="animateRobotWave()" title="أهلاً بك!">
                <div class="bot-bubble-top" id="robotGreetingBubble">أهلاً يا بطل! 👋</div>
                <svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="10" r="4.5" fill="#00f2fe" stroke="#1e293b" stroke-width="2"/>
                    <path d="M50 14.5V23" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
                    
                    <rect x="26" y="22" width="48" height="36" rx="16" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
                    <rect x="33" y="28" width="34" height="22" rx="9" fill="#0f172a"/>
                    <circle cx="43" cy="39" r="4.5" fill="#00f2fe"/>
                    <circle cx="57" cy="39" r="4.5" fill="#00f2fe"/>
                    <path d="M47 45.5C48.5 47 51.5 47 53 45.5" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round"/>

                    <rect x="22" y="32" width="5" height="15" rx="2.5" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
                    <rect x="73" y="32" width="5" height="15" rx="2.5" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>

                    <path d="M37 57C37 54 41 53 50 53C59 53 63 54 63 57L60 74C60 77 40 77 40 74L37 57Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.8"/>
                    <rect x="42" y="58" width="16" height="11" rx="4" fill="#38bdf8" stroke="#1e293b" stroke-width="1.5"/>

                    <path d="M38 73C38 73 34 78 35 83C35 85 41 85 41 83L42 74" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
                    <ellipse cx="36" cy="85" rx="6" ry="4" fill="#64748b" stroke="#1e293b" stroke-width="2"/>

                    <path d="M60 73C60 73 66 77 72 79C74 80 75 83 73 85L69 85" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
                    <ellipse cx="73" cy="85" rx="7" ry="4" fill="#64748b" stroke="#1e293b" stroke-width="2"/>

                    <path d="M37 60L29 70L24 74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="23" cy="75" r="3.5" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>

                    <g class="waving-hand-arm">
                        <path d="M63 60L72 52L78 40" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="79" cy="38" r="4.5" fill="#00f2fe" stroke="#1e293b" stroke-width="2"/>
                        <path d="M76 34L77 31M80 33L82 30M83 36L86 34" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>

            <div class="avatar-ring"></div>
            <div class="avatar-img-wrap">
                <img src="{{ teacher_avatar or 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop' }}" 
                     alt="{{ teacher_name }}"
                     onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop';">
            </div>
            <div class="badge-verified">✓</div>
        </div>

        <div class="teacher-tag">
            <span>⭐</span> المنصة التعليمية الرقمية الشاملة
        </div>

        <h1 class="teacher-title">
            الأستاذة <span>هايدي عطية</span>
        </h1>

        <div class="cta-button-group">
            <button class="btn-cta btn-register-cta" onclick="openAuthModal('register')">
                <span>طلب التسجيل</span>
                <span style="font-size:1.15rem;">✨</span>
            </button>
            <button class="btn-cta btn-login-cta" onclick="openAuthModal('login')">
                <span>تسجيل الدخول</span>
                <span style="font-size:1.15rem;">🔐</span>
            </button>
        </div>

    </div>

    <!-- نافذة المودال -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <button class="modal-close" onclick="closeAuthModal()">✕</button>

            <h3 id="modalTitle" style="font-size: 1.25rem; margin-bottom: 1rem; text-align: center; color: var(--cyan);">تسجيل الدخول</h3>

            <div class="role-selector">
                <button type="button" class="role-btn active" id="roleStudent" onclick="setRole('student')">👨‍🎓 طالب</button>
                <button type="button" class="role-btn" id="roleParent" onclick="setRole('parent')">👨‍👩‍👧 ولي أمر</button>
            </div>

            <form id="authForm">
                <input type="hidden" id="currentRole" value="student">
                <input type="hidden" id="authMode" value="login">

                <div id="registerOnlyFields" style="display: none;">
                    <input type="text" id="userName" class="form-input" placeholder="اسم الطالب ثلاثي">
                    
                    <div id="studentGradeField">
                        <label style="display:block; font-size:0.8rem; color:var(--cyan); margin-bottom:4px;">اختر المرحلة الدراسية:</label>
                        <select id="userGrade" class="form-select">
                            <option value="p4">الصف الرابع الابتدائي</option>
                            <option value="p5">الصف الخامس الابتدائي</option>
                            <option value="p6">الصف السادس الابتدائي</option>
                            <option value="m1">الصف الأول الإعدادي</option>
                            <option value="m2">الصف الثاني الإعدادي</option>
                        </select>
                    </div>

                    <div id="parentPhoneField">
                        <input type="tel" id="parentPhone" class="form-input" placeholder="رقم هاتف ولي الأمر">
                    </div>
                </div>

                <input type="tel" id="userPhone" class="form-input" placeholder="رقم الهاتف الخاص بك" required>
                <input type="password" id="userPassword" class="form-input" placeholder="كلمة المرور" required>

                <button type="submit" class="btn-submit" id="submitBtnText">تأكيد الدخول</button>
                <div id="authAlert" style="margin-top: 10px; font-size: 0.85rem; text-align: center; display: none; line-height: 1.5;"></div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
            window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
            const pts = Array.from({length: 35}, () => ({
                x: Math.random() * w, y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35
            }));
            function loop() {
                ctx.clearRect(0,0,w,h);
                pts.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0 || p.x>w) p.vx *= -1; if(p.y<0 || p.y>h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, Math.PI*2);
                    ctx.fillStyle = '#00f2fe'; ctx.fill();
                    for(let j=i+1; j<pts.length; j++) {
                        const d = Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                        if(d < 120) {
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(pts[j].x, pts[j].y);
                            ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 - d/1000})`; ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // 🌟 رسائل قصيرة جداً وموجزة
        const botQuotes = [
            "أهلاً يا بطل! 👋",
            "جاهز للتفوق؟ 🚀",
            "امتحانات سهلة 🎯",
            "مرحباً بك! ✨",
            "نورت المنصة ⭐"
        ];
        let qIdx = 0;

        function animateRobotWave() {
            qIdx = (qIdx + 1) % botQuotes.length;
            const bubble = document.getElementById('robotGreetingBubble');
            bubble.textContent = botQuotes[qIdx];
            
            const arm = document.querySelector('.waving-hand-arm');
            arm.style.animation = 'none';
            arm.offsetHeight;
            arm.style.animation = 'waveArm 0.3s ease-in-out infinite alternate';
            setTimeout(() => {
                arm.style.animation = 'waveArm 1.6s ease-in-out infinite alternate';
            }, 1200);
        }

        setInterval(() => {
            qIdx = (qIdx + 1) % botQuotes.length;
            document.getElementById('robotGreetingBubble').textContent = botQuotes[qIdx];
        }, 4500);

        const modal = document.getElementById('authModal');
        const modalTitle = document.getElementById('modalTitle');
        const regFields = document.getElementById('registerOnlyFields');
        const studentGradeField = document.getElementById('studentGradeField');
        const parentPhoneField = document.getElementById('parentPhoneField');
        const authMode = document.getElementById('authMode');
        const currentRole = document.getElementById('currentRole');
        const submitBtnText = document.getElementById('submitBtnText');
        const authAlert = document.getElementById('authAlert');

        function openAuthModal(mode) {
            authAlert.style.display = 'none';
            authMode.value = mode;
            modal.classList.add('active');
            if (mode === 'register') {
                modalTitle.textContent = "طلب تسجيل حساب جديد";
                regFields.style.display = 'block';
                submitBtnText.textContent = "إرسال طلب التسجيل";
            } else {
                modalTitle.textContent = "تسجيل الدخول المباشر";
                regFields.style.display = 'none';
                submitBtnText.textContent = "دخول إلى الحساب";
            }
            setRole('student');
        }

        function closeAuthModal() { modal.classList.remove('active'); }

        function setRole(role) {
            currentRole.value = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleParent').classList.toggle('active', role === 'parent');
            
            const isReg = authMode.value === 'register';
            studentGradeField.style.display = (role === 'student' && isReg) ? 'block' : 'none';
            parentPhoneField.style.display = (role === 'student' && isReg) ? 'block' : 'none';

            const nameInput = document.getElementById('userName');
            if (nameInput) {
                nameInput.placeholder = (role === 'student') ? "اسم الطالب ثلاثي" : "اسم ولي الأمر ثلاثي";
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            authAlert.style.display = 'none';
            submitBtnText.disabled = true;

            const mode = authMode.value;
            const endpoint = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
            const payload = {
                phone: document.getElementById('userPhone').value,
                password: document.getElementById('userPassword').value,
                role: currentRole.value,
                name: document.getElementById('userName').value,
                grade: document.getElementById('userGrade').value,
                parent_phone: document.getElementById('parentPhone').value
            };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (res.ok && data.status === 'success') {
                    window.location.href = data.redirect;
                } else if (res.ok && data.status === 'pending') {
                    authAlert.style.color = 'var(--emerald)';
                    authAlert.textContent = data.msg;
                    authAlert.style.display = 'block';
                    document.getElementById('authForm').reset();
                } else {
                    authAlert.style.color = 'var(--rose)';
                    authAlert.textContent = data.msg || 'حدث خطأ في البيانات';
                    authAlert.style.display = 'block';
                }
            } catch (err) {
                authAlert.style.color = 'var(--rose)';
                authAlert.textContent = 'فشل الاتصال بالخادم، يرجى المحاولة لاحقاً';
                authAlert.style.display = 'block';
            } finally {
                submitBtnText.disabled = false;
            }
        });
    </script>
</body>
</html>
